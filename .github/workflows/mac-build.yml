# Builds the macOS .dmg files (Apple Silicon and Intel). macOS apps can only be
# packaged on a Mac, so this runs on GitHub's macOS runners. Start it by hand
# from the Actions tab; with a release tag it also attaches the .dmg files to
# that release (creating it if needed).
name: Mac build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the .dmg files to (blank: workflow artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Unsigned apps are refused outright on Apple Silicon, so the app is
      # ad-hoc signed (identity "-"). It is not notarised: players open it the
      # first time from System Settings > Privacy & Security > Open Anyway.
      - run: npm run package:mac -- --publish never -c.mac.identity=-

      - uses: actions/upload-artifact@v4
        with:
          name: original-gangster-mac
          path: release/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Mac Setup" --notes "macOS build (Apple Silicon and Intel)."
          gh release upload "$TAG" release/*.dmg --clobber
